server:
  port: ${PORT:8080}

spring:
  application:
    name: keystone
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/keystone}
    username: ${DB_USERNAME:keystone}
    password: ${DB_PASSWORD:keystone}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

keystone:
  jwt:
    # Never commit real secrets - override via JWT_SECRET env var in every environment.
    secret: ${JWT_SECRET:change-this-dev-only-secret-please-override-1234567890}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.zidio.keystone: INFO
