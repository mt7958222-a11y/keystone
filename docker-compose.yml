version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keystone
      POSTGRES_USER: keystone
      POSTGRES_PASSWORD: keystone
    ports:
      - "5432:5432"
    volumes:
      - keystone_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keystone"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/keystone
      DB_USERNAME: keystone
      DB_PASSWORD: keystone
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-only-secret-please-override-1234567890}
      JWT_EXPIRATION_MINUTES: 480
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  keystone_db_data:
